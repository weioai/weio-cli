name: Publish weio-ai to PyPI

on:
  push:
    tags:
      - v1.0.4

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify 1.0.4 sources and sealed digests
    runs-on: ubuntu-latest
    if: github.repository == 'weioai/weio-cli' && github.ref == 'refs/tags/v1.0.4'
    outputs:
      verified: ${{ steps.verify.outputs.ok }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --no-cache-dir pytest httpx prompt_toolkit

      - name: Verify sealed 1.0.4 digests, README parity, and extracted sdist tests
        id: verify
        run: |
          set -euo pipefail
          RELEASE_DIR=release/weio-ai-104
          actual_whl="$(sha256sum "${RELEASE_DIR}/weio_ai-1.0.4-py3-none-any.whl" | awk '{print $1}')"
          actual_tar="$(sha256sum "${RELEASE_DIR}/weio_ai-1.0.4.tar.gz" | awk '{print $1}')"
          test "${actual_whl}" = "043204994f415f7fa6e9f81fa284fa1bfb4f49a0892d23e630d7e587113d19de"
          test "${actual_tar}" = "b30401fa8a66ca9ea058658c20e160053f87604d2078af82ed538ee4f7b8fa0d"

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          tar -xzf "${RELEASE_DIR}/weio_ai-1.0.4.tar.gz" -C "${tmpdir}"
          python3 -c 'import hashlib, sys, zipfile; from pathlib import Path; wp, sd = Path(sys.argv[1]), Path(sys.argv[2]); exp = "8dbedddb81751991643e77be3c4e21808987584c2a1dd4c6ebcef815634e5a83"; assert hashlib.sha256((sd / "README.md").read_bytes()).hexdigest() == exp; assert hashlib.sha256((sd / "PKG-INFO").read_text("utf-8").split("\n\n", 1)[1].encode("utf-8")).hexdigest() == exp; zf = zipfile.ZipFile(wp); assert not [n for n in zf.namelist() if n.endswith(".pyc") or "__pycache__" in n]; assert hashlib.sha256(zf.read("weio_ai-1.0.4.dist-info/METADATA").decode("utf-8").split("\n\n", 1)[1].encode("utf-8")).hexdigest() == exp; print("PARITY_OK", exp)' "${RELEASE_DIR}/weio_ai-1.0.4-py3-none-any.whl" "${tmpdir}/weio_ai-1.0.4"
          (cd "${tmpdir}/weio_ai-1.0.4" && PYTHONPATH=src python -B -m pytest -q)

          mkdir -p dist
          cp "${RELEASE_DIR}/weio_ai-1.0.4-py3-none-any.whl" "${RELEASE_DIR}/weio_ai-1.0.4.tar.gz" dist/
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Upload verified 1.0.4 distribution artifacts to workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: weio-ai-104-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: Publish 1.0.4 to PyPI via OIDC Trusted Publishing
    needs: verify-and-build
    if: needs.verify-and-build.outputs.verified == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/weio-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified 1.0.4 distribution artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: weio-ai-104-dist
          path: dist/

      - name: Final digest check before OIDC upload
        run: |
          set -euo pipefail
          test "$(sha256sum dist/weio_ai-1.0.4-py3-none-any.whl | awk '{print $1}')" = "043204994f415f7fa6e9f81fa284fa1bfb4f49a0892d23e630d7e587113d19de"
          test "$(sha256sum dist/weio_ai-1.0.4.tar.gz | awk '{print $1}')" = "b30401fa8a66ca9ea058658c20e160053f87604d2078af82ed538ee4f7b8fa0d"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
